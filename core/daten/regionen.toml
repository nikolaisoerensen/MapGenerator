# Die neun Regionsparametersaetze (Ticket #29).
#
# Frueher standen diese Werte als Modulkonstanten (REGIONEN,
# KUESTEN_ARCHETYPEN) in core/terrain_weltkarte.py: nicht diffbar, nicht von
# Tests lesbar ohne Import, nicht ohne Codeaenderung verstellbar. Der Umzug
# hierher ist WERTNEUTRAL - keine Zahl hat sich dabei geaendert, siehe die
# Gegenprobe in tests/smoke_test_regionen_welt.py (unveraendertes Ergebnis)
# und tests/smoke_test_regionsdaten_vollstaendig.py (alle neun vollstaendig).
#
# core/terrain_weltkarte.py laedt diese Datei beim Import (_lade_regionsdaten)
# und baut daraus REGIONEN (3x3-Gitter, per zeile/spalte) und
# KUESTEN_ARCHETYPEN (je Regionsname 3 Eintraege). NIEDERSCHLAG_ZIEL und
# KLIMA_ZIEL werden daraus abgeleitet, nicht hier verdoppelt - sie deckten
# sich schon vor dem Umzug exakt mit niederschlag_mm/temp_mittel_m0/
# temp_spanne (siehe tests/smoke_test_weather_temperature_direktnormierung.py:
# "Die Eingabewerte in REGIONEN sind seither die lesbaren KLIMA_ZIEL-Werte
# selbst.").
#
# Die GUI (gui/tabs/region_tab.py) zeigt diese Werte NUR LESEND an - kein
# Regler, kein Eingabefeld schreibt in diese Datei. Die vorhandenen Regler im
# Regionsreiter ueberschreiben nur die aktuelle Kartenerzeugung
# (self.ueberschreibungen), nie den Katalog hier.
#
# Bedeutung der Felder je Region, ausfuehrlich begruendet (Eichgeschichte,
# Messwerte, Nutzerzitate) im Kopf von core/terrain_weltkarte.py unter
# "DIE NEUN REGIONEN" - das bleibt dort stehen, weil es Begruendung ist,
# keine Zahl:
#
#   zeile, spalte     Position im 3x3-Gitter (Nord/Mitte/Sued x West/Ost)
#   farbe             Kartenfarbe (Terrain-Reiter, Regional-Reiter, Legende)
#   volk              Kultur-Schluessel fuer den Siedlungsgenerator
#   bemerkung         Kurzcharakteristik, nur lesbar, keine Rechengroesse
#   hoehe_m           mittlere Hoehe der Region (negativ = ueberwiegend Wasser)
#   relief_m          Hoehenspanne um diese Mitte
#   formgroesse_m     Groesse der groessten Gelaendeform
#   rauheit           wie stark die feinen Oktaven mitreden (0.4 glatt .. 0.75 rau)
#   potenz            <1 hebt an (Hochflaeche), >1 drueckt herunter (Ebene+Gipfel)
#   wasser_soll       Zielwasseranteil in Prozent
#   flaeche_soll      Grundflaechen-Ausgleichsfaktor (tools/flaeche_eichen.py)
#   kuestenform       Kuestenform-Regionswert (kuestenform() in terrain_weltkarte.py)
#   temp_mittel_m0    Jahresmittel in Grad, auf Meereshoehe zurueckgerechnet
#   temp_spanne       Jahresspanne (Juli minus Januar) in Kelvin
#   niederschlag_mm   Jahresniederschlag in mm
#   wind_mittel_ms    mittlere Windgeschwindigkeit in m/s
#   hang_trockenheit  wie stark ein voller Suedhang austrocknet (Nordhang: feuchter)
#   talform           Exponent der Taeler-Querschnittskurve (klein=V, gross=U)
#
# Je Region folgen drei [[region.kuesten_archetypen]] - die an realen
# Kuesten orientierten Auspraegungen aus core/terrain_weltkarte.py,
# Abschnitt "KUESTEN-ARCHETYPEN":
#
#   name              Anzeigename des Archetyps
#   hoehe_faktor      Skaliert KUESTENHOEHE_M (450 m)
#   winkel_grad       Zielwinkel der Klippenfront (nie 90, siehe MAX_KLIPPENWINKEL_GRAD)
#   kantig            bricht die glatte Anstiegskurve in Facetten auf (Fjord/Schaeren)
#   strand_anteil     Anteil INNERHALB der eigenen Zone als Strand-Luecke
#   max_anteil        Obergrenze am gesamten Kuestenumfang der Region
#   reichweite_km     wie weit der Archetyp landeinwaerts/seewaerts wirkt

