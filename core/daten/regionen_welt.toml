# Path: core/daten/regionen_welt.toml
#
# DIE NEUN REGIONSPARAMETERSAETZE - Zeilen Nord -> Sued, Spalten West -> Ost.
#
# Bis 2026-09-17 standen diese Werte als Modulkonstanten (REGIONEN,
# KUESTEN_ARCHETYPEN, NIEDERSCHLAG_ZIEL, KLIMA_ZIEL) in
# core/terrain_weltkarte.py - nicht diffbar, nicht von Tests lesbar, nicht
# ohne Codeaenderung zu verstellen (docs/OFFENE_PUNKTE.md #29). Geladen wird
# diese Datei von core/daten/regionen_laden.py; core/terrain_weltkarte.py
# haengt seine Modulkonstanten weiter unter denselben Namen ein
# (REGIONEN, alle_regionen(), KUESTEN_ARCHETYPEN, NIEDERSCHLAG_ZIEL,
# KLIMA_ZIEL), damit kein anderes Modul etwas vom Umzug merkt.
#
# WERTNEUTRALER UMZUG: kein einziger Wert wurde beim Verschieben veraendert.
# NIEDERSCHLAG_ZIEL und KLIMA_ZIEL standen im Code als eigene Dicts, waren
# aber fuer alle neun Regionen bit-identisch mit den Feldern
# niederschlag_mm/temp_mittel_m0/temp_spanne hier - sie werden jetzt aus
# genau diesen Feldern abgeleitet (siehe regionen_laden.py), statt von Hand
# zweimal gepflegt zu werden.
#
# TOML statt JSON, weil TOML Kommentare kennt: die Kalibriergeschichte
# unten (Daten, Zitate, Messwerte) ist Teil des Projektwissens und muss
# neben den Werten stehen bleiben, nicht in einer zweiten Datei. Das Projekt
# benutzt TOML bereits an anderer Stelle (nachtbetrieb/sperrliste.toml,
# gelesen ueber die Python-Standardbibliothek tomllib) - keine neue
# Abhaengigkeit noetig.
#
# ==============================================================================
# ALLGEMEINE KALIBRIERGESCHICHTE (galt fuer REGIONEN als Ganzes)
# ==============================================================================
#
# HOEHEN SIND AUF 4 KM UMGERECHNET, NICHT ABGESCHRIEBEN. Echte Alpen haben
# 2500 m Relief auf 10 km; dieselbe Zahl auf 4 km waere eine Wand mit 60 Grad
# Durchschnittshang. Uebernommen ist das VERHAELTNIS von Relief zu Breite.
#
#   hoehe_m       MITTLERE Hoehe der Region, negativ = ueberwiegend Wasser
#   relief_m      Hoehenspanne um diese Mitte, also hoehe_m +/- relief_m/2
#   formgroesse_m Groesse der groessten Gelaendeform (Massiv, Ruecken, Becken)
#   rauheit       wie stark die feinen Oktaven mitreden (0.4 glatt .. 0.75 rau)
#   potenz        <1 hebt an (Hochflaeche), >1 drueckt herunter (Ebene + Gipfel)
#
# HOEHE IST DIE MITTE, NICHT DER TIEFSTE PUNKT. Zuerst stand hier die
# Grundflaeche, ueber der sich das Relief erhebt. Das war unbrauchbar: das
# normierte Relief hat nur std 0.140 (unabhaengige Oktaven mitteln sich
# heraus), t ueberstrich nur 0.21 bis 0.76 - die Grundflaeche wurde NIE
# erreicht, und jede Kuestenregion blieb zu 100 % trocken. Mit der Mitte als
# Bezug ist der Wasseranteil dagegen unmittelbar einstellbar.
#
# HOEHEN NEU GEEICHT AM 2026-08-06, nach der Nord-Sued-Korrektur. Die alten
# Werte waren gegen einen Kontinent eingestellt, der auf dem Kopf stand
# (siehe voronoi_regionen). Nach der Umkehr sitzt jede Region auf einem
# anderen Stueck der unregelmaessigen Form, und der Nordlappen traegt mehr
# Wasser als der Suedlappen - das Clonagh sprang von 6 auf 26 Prozent.
#
# Geeicht wurde NUR `hoehe_m`, gemittelt ueber FUENF Seeds, damit die Werte
# nicht auf eine einzelne Kontinentform passen. `relief_m` blieb bewusst
# unberuehrt: der gemessene Hang ist zu einem grossen Teil gar nicht der
# eigene. Ein als Morobora gefuehrtes Pixel traegt im Mittel 33 % FREMDES
# Gewicht und damit 372 m Relief statt der eingetragenen 138 (Estrande
# +181 %). Bei hoher Reinheit (Gewicht > 0.95) trifft die Morobora ihren
# Sollhang exakt - 3.4 gegen 3.0. Das Relief auf die Mischung zu eichen
# haette es auf 30 m gedrueckt: eine Region ohne Charakter, nur damit eine
# Zahl stimmt, die etwas anderes misst.
#
# ZWEI SEEDS WAREN ZU WENIG (nachkorrigiert am 2026-08-06). Der erste
# Durchgang stellte Skerrheim auf 196.6 m; ueber fuenf Seeds gemessen waren
# das 10 Prozentpunkte zu wenig Wasser, richtig sind 113.1 m. Die Streuung
# EINER Region ueber Seeds betraegt bis zu 37 Prozentpunkte Wasseranteil und
# 11 Grad Hang - sie sitzt je nach Kontinentform auf einem anderen Stueck
# Land und hat andere Nachbarn. Weniger als vier Seeds eichen auf eine Form,
# nicht auf die Regel.
#
# DREI KULTURNAMEN GEAENDERT AM 2026-08-06 (docs/KULTUREN_UND_ORTE.md):
#
#   Nevadin        "-"      -> Alemannen  hatte gar keine Kultur und bekam
#                                           damit keine Siedlungen
#   Nebelrode      Franken  -> Sachsen     war doppelt mit der Estrande belegt
#   Thalassia      Phoenizier -> Byzantiner  die phoenizischen Stadtstaaten
#                                           enden rund 1500 Jahre vor dem
#                                           Zeitschnitt
#
# `volk` ist ein SCHLUESSEL, kein Schmuck: der Siedlungsgenerator gruppiert
# danach (2-5 Orte je Kultur, Zusammenhang innerhalb einer Kultur erzwungen)
# und waehlt danach die Landmark- und Roadsite-Arten aus. Zwei Regionen mit
# demselben `volk` waeren eine Kultur mit doppelter Flaeche.
#
# `farbe` faerbt die Region im Terrain- und im Regional-Reiter. NEUN
# UNTERSCHEIDBARE FARBEN, UND KEIN GELB: Gelb ist fuer das
# 3x3-Ausschnittsgitter reserviert, das im selben Bild liegt. Kein reines
# Blau, weil das Meer blau ist.
#
# DIE ZIELWERTE - das, was auf der Karte HERAUSKOMMEN soll. `temp_mittel_m0`
# und `temp_spanne` sind NICHT die gemessenen Kartenwerte, sondern gegen die
# Regionsmischung vorkompensierte Eingabewerte: ein Pixel, das als Samarcia
# gefuehrt wird, traegt rund 40 % fremdes Gewicht und wird von den
# kuehleren Nachbarn heruntergezogen - gemessen -2.2 K, die Griechischen
# Inseln -1.8 K. Damit die Klimatabelle eine FESTLEGUNG bleibt und nicht nur
# eine Hoffnung, wurden die Eingabewerte so geeicht, dass die GEMESSENEN
# Werte auf der Karte landen (3 Seeds, 7 Runden).
# tests/smoke_test_regionen_welt.py prueft die gemessenen Werte gegen diese
# hier.
#
# NACHGEEICHT AM 2026-08-07 nach Einfuehrung von KLIMA_SCHAERFE. Mit der
# schaerferen Klimamischung faellt die Verduennung kleiner aus, und die
# Kompensation entsprechend: Fjordlands Jahresspanne stand vorher auf 5.2
# und jetzt auf 10.4 bei einem Ziel von 13.0.
#
# Der Jahresniederschlag (niederschlag_mm) ist NICHT vorkompensiert - er
# steht so, wie er auf der Karte herauskommen soll. Das Wettersystem
# normiert das fertige Niederschlagsfeld direkt darauf (siehe
# weather_generator._je_region_auf_mittel), womit jede Region ihren Wert per
# Konstruktion trifft.
#
# Abgeleitet aus Bezugsorten, die der Nutzer vorgegeben hat: Cork, Bergen,
# Wologda, La Rochelle, Chur, Bamberg, Madrid, Rom, Iraklio. Die
# Rueckrechnung auf Meereshoehe (temp_mittel_m0) benutzt 0.6 K je 100 m;
# Herleitung in docs/BIOME_MATRIX.md. WARUM MEERESHOEHE UND NICHT
# REGIONSHOEHE: `hoehe_m` ist ein GEEICHTER Wert, der schon zweimal
# nachgezogen wurde - waere das Klima darauf bezogen, waere es
# stillschweigend mitgewandert.
#
# SPREIZUNG (fest, gilt fuer alle Regionen, kein Regionsfeld): normiertes
# Relief -> [0,1] mit Faktor 1.5. Gemessen hat das normierte Relief
# std 0.140; mit 1.5 liegen rund +/- 2.4 Standardabweichungen in [0,1].
#
# FLAECHENEICHUNG (flaeche_soll), eingeregelt am 2026-08-24 mit
# tools/flaeche_eichen.py. Steuert, wieviel GRUNDflaeche eine Region
# bekommt - noetig, weil Grundflaeche und NUTZWERT nicht linear
# zusammenhaengen (Skerrheim verliert rund ein Drittel ans Wasser und dann
# die Haelfte des Rests an zu steile Haenge, die Griechischen Inseln zwei
# Drittel ans Wasser). ES IST EIN NULLSUMMENSPIEL - die Werte verteilen den
# Kontinent um, sie vergroessern ihn nicht. Die ZIELWERTE selbst stehen
# NICHT hier, sondern in tests/smoke_test_regionen_fairness.py.
#
# `talform` (Nutzervorgabe 2026-08-24: *"ja flusstypen sollte es geben,
# nach region. zB alpen eher V. Skerrheim U und im Atlantik irgendwas
# dazwischen zB."*) ist der Exponent der Querschnittskurve in
# taeler_eingraben(): `profil = (1 - exp(-abstand/breite)) ** talform`.
# klein (0.8-1.1) V-Tal, mittel (1.3-1.5) dazwischen, gross (2.0-2.6) U-Tal.
# Rueckfall bei fehlendem Feld war frueher 1.3 fuer alle - seit diesem
# Umzug gibt es keinen stillen Rueckfall mehr, siehe
# tests/smoke_test_regionen_datei_vollstaendig.py.
#
# `hang_trockenheit` (Nutzervorgabe 2026-08-24: *"Skerrheim, voronoi mit
# viel suedhang ist etwas trockener als fjordland nordhang, dann Samarcia
# suedhang total trocken, nordhang etwas feuchter."*) ist der Anteil, um
# den ein voller Suedhang trockener wird als die Ebene - ein voller
# Nordhang wird um denselben Betrag feuchter. DIE MODULATION IST RELATIV,
# nicht absolut.
#
# 2026-08-07 ZWEI FLAECHENANPASSUNGEN AN DER WELTGROESSE (nicht an
# einzelnen Regionswerten, WELT_KM/KONTINENT_KM in terrain_weltkarte.py):
# Atlantikkueste (Estrande) +40 % Flaechenanteil auf Nutzerwunsch, und
# Macchia/Thalassia/Estrande zuvor bereits per Faktor 1.5/1.5/1.25
# gegenueber den uebrigen angehoben, weil sie 40/65/45 % ihrer Flaeche ans
# Wasser verlieren.

