# ==============================================================================
# KUESTENARCHETYPEN - drei an realen Kuesten orientierte Auspraegungen je
# Region, die laengs der Kuestenlinie deterministisch wechseln
# (core.terrain_weltkarte._kuesten_umformen()). Laeuft NACH kuestenform()
# (die regionsweite Grundform bleibt unveraendert bestehen) und VOR der
# Seegrad-Tiefenzuweisung.
#
#   hoehe_faktor    skaliert KUESTENHOEHE_M (450 m, globale Konstante)
#   winkel_grad     Zielwinkel der Klippenfront (nie 90 - "eher 80 Grad
#                   statt 90" war die ausdrueckliche Nutzervorgabe)
#   kantig          bricht die glatte Anstiegskurve in Facetten auf
#                   (Fjord-/Schaerencharakter statt einer glatten Wand -
#                   Norwegen/Albanien gegen Irland/Portugal)
#   strand_anteil   Anteil INNERHALB der eigenen Zone, der als
#                   Strand-Luecke ausgespart wird (nie eine durchgehende
#                   Klippenwand)
#   max_anteil      Obergrenze am gesamten Kuestenumfang der Region -
#                   garantiert per Quote, nicht nur wahrscheinlich
#   reichweite_km   wie weit der Archetyp laengs der Kueste reicht
#
# Thalassia/Santorini-Kliff: hoehe_faktor 2026-08-13 von 1.7 auf 1.15
# gesenkt (Nutzer-Vorgabe: "das ist viel zu extrem an der stelle") - 1.7
# ergibt 765 m Zielhoehe, deutlich ueber jeder anderen Klippe der Tabelle.
# 1.15 ergibt rund 520 m - immer noch die hoechste Steilkueste der
# Samarcia/Griechische-Inseln-Gruppe, aber ohne Ausreisser.
# ==============================================================================

